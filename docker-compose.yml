services:
  kkt-nest:
    build: ./nest
    env_file:
      - ./nest/.env
    ports:
      - "${BACK_PORT:-3001}:3001"
    environment:
      PORT: 3001
      REACT: ${REACT}
      REACT_DOCKER: ${REACT_DOCKER}
      DB_ROOT: ${DB_ROOT}
    volumes:
      - ${DB_MOUNT}:/data
    restart: unless-stopped

  kkt-react:
    build:
      context: ./react
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL}
    ports:
      - "${FRONT_PORT:-8080}:80"
    depends_on:
      - kkt-nest
    restart: unless-stopped